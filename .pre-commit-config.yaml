repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4          # whatever autoupdate set, matching requirements-test.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src/
        language: system
        types: [python]
        pass_filenames: false