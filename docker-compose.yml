services:
  api:
    build: .
    container_name: mlops_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks: [ mlops_network ]

  worker:
    build: .
    container_name: mlops_worker
    command: arq src.worker.tasks.WorkerSettings
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks: [ mlops_network ]

  redis:
    image: redis:7-alpine
    container_name: mlops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks: [ mlops_network ]

  db:
    image: postgres:15-alpine
    container_name: mlops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ mlops_network ]

volumes:
  postgres_data:

networks:
  mlops_network:
    driver: bridge
