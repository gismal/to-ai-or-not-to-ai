<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI or Not AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0f;
            --surface: #131316;
            --border: #2a2a32;
            --border-hi: #555562;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --dim: #52525b;
            --ai: #c0392b;
            --real: #27ae60;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --font-serif: 'IM Fell English', serif;
        }

        body {
            width: 320px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .wordmark {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .conn-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dim);
            transition: background .3s;
        }

        .conn-dot.ok {
            background: var(--real);
        }

        .conn-dot.err {
            background: var(--ai);
        }

        .body {
            padding: 16px;
        }

        .access-line {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 14px;
            min-height: 22px;
        }

        .access-line.err {
            color: var(--ai);
        }

        .label {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .field {
            margin-bottom: 12px;
        }

        input[type="url"],
        input[type="password"] {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 8px 10px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            outline: none;
            transition: border-color .2s;
        }

        input:focus-visible {
            border-color: var(--border-hi);
        }

        input::placeholder {
            color: var(--dim);
        }

        .seg {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 3px;
            gap: 2px;
        }

        .seg-btn {
            flex: 1;
            padding: 5px 8px;
            border: none;
            border-radius: 13px;
            background: transparent;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s, color .2s;
            white-space: nowrap;
        }

        .seg-btn.on {
            background: var(--text);
            color: var(--bg);
        }

        .rule {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin: 13px 0;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-label {
            font-size: 12px;
        }

        .toggle-hint {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 11px;
            color: var(--muted);
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .toggle input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            margin: 0;
            z-index: 1;
        }

        .track {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 10px;
            transition: background .2s;
        }

        .track::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--muted);
            top: 3px;
            left: 3px;
            transition: transform .2s, background .2s;
        }

        .toggle input:checked+.track {
            background: rgba(39, 174, 96, 0.25);
        }

        .toggle input:checked+.track::after {
            transform: translateX(16px);
            background: var(--real);
        }

        .toggle input:focus-visible+.track {
            outline: 1px solid var(--border-hi);
            outline-offset: 2px;
        }

        .disclosure {
            font-size: 10px;
            color: var(--muted);
            margin-top: 6px;
            line-height: 1.6;
        }

        details.adv summary {
            cursor: pointer;
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 12px;
            color: var(--muted);
            list-style: none;
        }

        details.adv summary::-webkit-details-marker {
            display: none;
        }

        details.adv summary::before {
            content: '+ ';
            font-family: var(--font-mono);
            font-style: normal;
        }

        details.adv[open] summary::before {
            content: '- ';
        }

        details.adv summary:hover {
            color: var(--text);
        }

        .adv-body {
            margin-top: 12px;
        }

        .adv-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-save {
            flex: 1;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color .2s, color .2s;
        }

        .btn-save:hover {
            border-color: var(--border-hi);
            color: var(--text);
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .link-btn:hover {
            color: var(--text);
        }

        .status {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 11px;
            text-align: center;
            margin-top: 10px;
            min-height: 16px;
            color: var(--muted);
        }

        .status.err {
            color: var(--ai);
        }

        .hint {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin-top: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="wordmark">AI or Not AI</span>
        <div class="conn-dot" id="connDot" role="img" aria-label="Connection status"></div>
    </div>

    <div class="body">
        <div class="access-line" id="accessLine" role="status" aria-live="polite">Setting the stage...</div>

        <div class="field">
            <span class="label" id="modeLabel">Mode</span>
            <div class="seg" role="group" aria-labelledby="modeLabel">
                <button class="seg-btn" id="modeFast" type="button">Fast</button>
                <button class="seg-btn" id="modeExplain" type="button">The Mousetrap</button>
            </div>
        </div>

        <hr class="rule" />

        <div class="toggle-row">
            <div>
                <div class="toggle-label">Passive Badge Mode</div>
                <div class="toggle-hint">Badge AI images as you browse</div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="passiveBadge" aria-label="Passive badge mode" />
                <span class="track"></span>
            </label>
        </div>
        <div class="disclosure">When on, large images from pages you visit are sent to the server for analysis.</div>

        <hr class="rule" />

        <details class="adv" id="adv">
            <summary>Use your own server or key</summary>
            <div class="adv-body">
                <div class="field">
                    <label class="label" for="apiUrl">Server address</label>
                    <input type="url" id="apiUrl" spellcheck="false" />
                </div>
                <div class="field">
                    <label class="label" for="apiKey">Access key (optional)</label>
                    <input type="password" id="apiKey" placeholder="Leave empty for the public demo"
                        autocomplete="off" />
                </div>
                <div class="adv-actions">
                    <button class="btn-save" id="save" type="button">Save &amp; test</button>
                    <button class="link-btn" id="reset" type="button">Reset to demo</button>
                </div>
            </div>
        </details>

        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="hint">Right-click any image to summon the detector.</div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>

</html>
