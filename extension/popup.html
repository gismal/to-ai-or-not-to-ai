<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI or Not AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0f;
            --surface: #131316;
            --border: #2a2a32;
            --border-hi: #555562;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --dim: #52525b;
            --ai: #c0392b;
            --real: #27ae60;
            --uncertain: #d4a017;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --font-serif: 'IM Fell English', serif;
        }

        body {
            width: 320px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .wordmark {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .conn-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dim);
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .conn-dot.ok {
            background: var(--real);
        }

        .conn-dot.err {
            background: var(--ai);
        }

        /* ── Body ── */
        .body {
            padding: 16px;
        }

        .label {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .field {
            margin-bottom: 13px;
        }

        input[type="url"],
        input[type="password"] {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 8px 10px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--border-hi);
        }

        input::placeholder {
            color: var(--muted);
        }

        /* ── Mode toggle ── */
        .seg {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 3px;
            gap: 2px;
        }

        .seg-btn {
            flex: 1;
            padding: 5px 8px;
            border: none;
            border-radius: 13px;
            background: transparent;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .seg-btn.on {
            background: var(--text);
            color: var(--bg);
        }

        /* ── Toggle switch ── */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 13px;
        }

        .toggle-text .toggle-label {
            font-size: 13px;
            color: var(--text);
        }

        .toggle-text .toggle-hint {
            font-size: 14px;
            color: var(--muted);
            font-family: var(--font-serif);
            font-style: italic;
            margin-top: 1px;
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .track {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--muted);
            top: 3px;
            left: 3px;
            transition: transform 0.2s, background 0.2s;
        }

        .toggle input:checked+.track {
            background: rgba(39, 174, 96, 0.25);
        }

        .toggle input:checked+.track::after {
            transform: translateX(16px);
            background: var(--real);
        }

        /* ── Divider ── */
        .rule {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin: 13px 0;
        }

        /* ── Save button ── */
        .btn-save {
            width: 100%;
            padding: 9px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
            letter-spacing: 0.04em;
        }

        .btn-save:hover {
            border-color: var(--border-hi);
            color: var(--text);
        }

        /* ── Status ── */
        .status {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 16px;
            color: var(--muted);
        }

        .status.ok {
            color: var(--real);
        }

        .status.err {
            color: var(--ai);
        }

        /* ── Hint ── */
        .hint {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.18);
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="wordmark">AI or Not AI</span>
        <div class="conn-dot" id="connDot" title="API status"></div>
    </div>

    <div class="body">
        <div class="field">
            <label class="label" for="apiUrl">API URL</label>
            <input type="url" id="apiUrl" placeholder="https://to-ai-or-not-to-ai.onrender.com" spellcheck="false" />
        </div>

        <div class="field">
            <label class="label" for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="X-API-Key" />
        </div>

        <div class="field">
            <label class="label">Mode</label>
            <div class="seg">
                <button class="seg-btn" id="modeFast">Fast</button>
                <button class="seg-btn" id="modeExplain">The Mousetrap</button>
            </div>
        </div>

        <hr class="rule" />

        <div class="toggle-row">
            <div class="toggle-text">
                <div class="toggle-label">Passive Badge Mode</div>
                <div class="toggle-hint">Badge AI images as you browse</div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="passiveBadge" />
                <span class="track"></span>
            </label>
        </div>

        <hr class="rule" />

        <button class="btn-save" id="save">Save &amp; Test Connection</button>
        <div class="status" id="status"></div>

        <hr class="rule" />

        <div class="hint">Right-click any image to summon the detector.</div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
