<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI or Not AI — Verdict</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0f;
            --surface: #131316;
            --border: #2a2a32;
            --border-hi: #555562;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --dim: #52525b;
            --ai: #c0392b;
            --real: #27ae60;
            --uncertain: #d4a017;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --font-serif: 'IM Fell English', serif;
        }

        body {
            width: 460px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Topbar ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(13, 13, 15, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .wordmark {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .mode-tag {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 11px;
            color: var(--muted);
        }

        /* ── Loading ── */
        #view-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 14px;
        }

        @keyframes hourglassPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        .loading-hourglass {
            font-size: 32px;
            animation: hourglassPulse 2s infinite ease-in-out;
        }

        .status-text {
            font-family: var(--font-serif);
            font-size: 17px;
            font-style: italic;
            color: var(--muted);
        }

        /* ── Error ── */
        #view-error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 14px;
            padding: 28px;
            text-align: center;
        }

        .err-msg {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 13px;
            color: var(--ai);
            background: rgba(192, 57, 43, 0.07);
            border: 1px solid rgba(192, 57, 43, 0.2);
            border-radius: 6px;
            padding: 12px 16px;
            line-height: 1.6;
        }

        /* ── Result ── */
        #view-result {
            display: none;
        }

        @keyframes curtainPart {
            from {
                clip-path: inset(0 50% 0 50%);
                opacity: 0;
            }

            to {
                clip-path: inset(0 0% 0 0%);
                opacity: 1;
            }
        }

        .broadside {
            text-align: center;
            padding: 20px 20px 0;
            animation: curtainPart 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .broadside-ornament {
            font-family: var(--font-serif);
            color: rgba(255, 255, 255, 0.14);
            font-size: 17px;
            letter-spacing: 0.5em;
            margin-bottom: 14px;
            user-select: none;
        }

        .broadside-verdict {
            font-family: var(--font-mono);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 7px;
        }

        .broadside-verdict.ai {
            color: var(--ai);
        }

        .broadside-verdict.real {
            color: var(--real);
        }

        .broadside-verdict.uncertain {
            color: var(--uncertain);
        }

        .broadside-heraldry {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
            letter-spacing: 0.06em;
        }

        .broadside-sub {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .broadside-rule {
            font-family: var(--font-mono);
            color: rgba(255, 255, 255, 0.1);
            font-size: 9px;
            letter-spacing: 0.4em;
            margin: 8px 0;
            user-select: none;
        }

        .broadside-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.28);
            margin-bottom: 18px;
        }

        .broadside-meta .sep {
            margin: 0 8px;
            color: rgba(255, 255, 255, 0.1);
        }

        .serif-detail {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 12px;
        }

        /* ── Confidence / Soliloquy ── */
        .conf-section {
            text-align: left;
            padding: 0 20px;
            margin-bottom: 14px;
        }

        .conf-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .conf-label {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 11px;
            color: var(--muted);
        }

        .conf-score {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
        }

        .conf-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .conf-fill {
            height: 100%;
            border-radius: 2px;
            width: 0;
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .conf-fill.ai {
            background: var(--ai);
        }

        .conf-fill.real {
            background: var(--real);
        }

        .conf-fill.uncertain {
            background: var(--uncertain);
        }

        .conf-zones {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* ── Rule / Sec ── */
        .rule {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            margin: 0 20px 16px;
        }

        .sec {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* ── Images: side-by-side ── */
        .images-wrap {
            padding: 0 20px;
            margin-bottom: 14px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .img-box {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            line-height: 0;
        }

        .img-box-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            padding: 5px 8px 3px;
            line-height: 1;
        }

        .img-box img {
            display: block;
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        /* Single image (Fast mode, no heatmap) */
        .img-single {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            line-height: 0;
        }

        .img-single img {
            display: block;
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            background: var(--surface);
        }

        /* ── Epilogue ── */
        .epilogue {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 0 20px 14px;
        }

        /* ── Actions ── */
        .actions {
            display: flex;
            gap: 8px;
            padding: 10px 20px 18px;
        }

        .btn-primary {
            flex: 1;
            padding: 9px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            transition: border-color 0.2s, color 0.2s;
            letter-spacing: 0.04em;
        }

        .btn-primary:hover {
            border-color: var(--border-hi);
            color: var(--text);
        }

        .btn-close {
            padding: 9px 14px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 5px;
            color: var(--dim);
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-close:hover {
            color: var(--muted);
        }
    </style>
</head>

<body>

    <div class="topbar">
        <span class="wordmark">AI or Not AI</span>
        <span class="mode-tag" id="modeTag"></span>
    </div>

    <!-- Loading -->
    <div id="view-loading">
        <div class="loading-hourglass">⌛</div>
        <div class="status-text" id="loadingText">The plot thickens...</div>
    </div>

    <!-- Error -->
    <div id="view-error">
        <div style="font-size:1.4rem; opacity:0.4;">⚠</div>
        <div class="err-msg" id="errMsg">A tragedy of errors occurred.</div>
        <button class="btn-close" onclick="window.close()">Close</button>
    </div>

    <!-- Result -->
    <div id="view-result">

        <div class="broadside">
            <div class="broadside-ornament">❧ ❦ ❧</div>
            <div class="broadside-verdict" id="verdict"></div>
            <div class="broadside-heraldry" id="heraldry"></div>
            <div class="broadside-sub" id="verdictSub"></div>
            <div class="broadside-rule">─ ─ ─ ─ ─ ─ ─ ─ ─ ─</div>
            <div class="broadside-meta" id="meta"></div>
            <div class="broadside-rule">─ ─ ─ ─ ─ ─ ─ ─ ─ ─</div>
        </div>

        <!-- Soliloquy / Confidence -->
        <div class="conf-section">
            <div class="conf-row">
                <span class="conf-label">Soliloquy</span>
                <span class="conf-score" id="confScore"></span>
            </div>
            <div class="conf-track">
                <div class="conf-fill" id="confFill"></div>
            </div>
            <div class="conf-zones">
                <span>Real</span>
                <span>Uncertain</span>
                <span>AI</span>
            </div>
        </div>

        <hr class="rule" />

        <!-- Images injected by results.js -->
        <div id="imagesArea"></div>

        <div class="epilogue" id="epilogue"></div>

        <div class="actions">
            <a class="btn-primary" id="btnPlayground" href="#" target="_blank">
                Open full analysis →
            </a>
            <button class="btn-close" onclick="window.close()">Close</button>
        </div>

    </div>

    <script src="results.js"></script>
</body>

</html>
