<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI or Not AI: Verdict</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0d0d0f;
            --surface: #131316;
            --border: #2a2a32;
            --border-hi: #555562;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --dim: #7a7a85;
            --ai: #c0392b;
            --real: #27ae60;
            --uncertain: #d4a017;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --serif: 'IM Fell English', serif
        }

        body {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            font: 12px/1.5 var(--mono);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden
        }

        button,
        a {
            font-family: inherit
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, .07);
            background: rgba(13, 13, 15, .95);
            position: sticky;
            top: 0;
            z-index: 10
        }

        .wordmark {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .14em
        }

        .mode-tag {
            font: italic 11px var(--serif);
            color: var(--muted)
        }

        #view-loading,
        #view-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 14px;
            padding: 28px;
            text-align: center
        }

        #view-error,
        #view-result {
            display: none
        }

        .hourglass {
            font-size: 32px;
            animation: pulse 2s infinite ease-in-out
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: .5
            }

            50% {
                transform: scale(1.1);
                opacity: 1
            }
        }

        .status-text {
            font: italic 17px var(--serif);
            color: var(--muted)
        }

        .err-msg {
            font: italic 13px/1.6 var(--serif);
            color: #e0584a;
            background: rgba(192, 57, 43, .07);
            border: 1px solid rgba(192, 57, 43, .25);
            border-radius: 6px;
            padding: 12px 16px
        }

        @keyframes curtain {
            from {
                clip-path: inset(0 50% 0 50%);
                opacity: 0
            }

            to {
                clip-path: inset(0);
                opacity: 1
            }
        }

        .broadside {
            text-align: center;
            padding: 20px 20px 0;
            animation: curtain .6s cubic-bezier(.16, 1, .3, 1) both
        }

        .ornament {
            font-family: var(--serif);
            color: rgba(255, 255, 255, .14);
            font-size: 17px;
            letter-spacing: .5em;
            margin-bottom: 14px;
            user-select: none
        }

        .verdict {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1;
            margin-bottom: 7px
        }

        .verdict.ai {
            color: var(--ai)
        }

        .verdict.real {
            color: var(--real)
        }

        .verdict.uncertain {
            color: var(--uncertain)
        }

        .heraldry {
            font: italic 13px var(--serif);
            color: rgba(255, 255, 255, .45);
            letter-spacing: .06em;
            margin-bottom: 10px
        }

        .sub {
            font: italic 15px var(--serif);
            color: var(--muted);
            margin-bottom: 18px
        }

        .rule-line {
            color: rgba(255, 255, 255, .12);
            font-size: 9px;
            letter-spacing: .4em;
            margin: 8px 0;
            user-select: none
        }

        .meta {
            font-size: 10px;
            color: rgba(255, 255, 255, .45);
            margin-bottom: 18px
        }

        .meta .sep {
            margin: 0 8px;
            color: rgba(255, 255, 255, .2)
        }

        .meta .serif {
            font: italic 12px var(--serif)
        }

        .conf {
            padding: 0 20px;
            margin-bottom: 14px
        }

        .conf-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px
        }

        .conf-label {
            font: italic 11px var(--serif);
            color: var(--muted)
        }

        .conf-score {
            font-size: 11px;
            font-weight: 600
        }

        .conf-track {
            position: relative;
            height: 3px;
            border-radius: 2px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, rgba(39, 174, 96, .55), rgba(212, 160, 23, .55) 55%, rgba(192, 57, 43, .55))
        }

        .conf-marker {
            position: absolute;
            top: -4px;
            left: 0;
            width: 2px;
            height: 11px;
            background: var(--text);
            transform: translateX(-50%);
            transition: left 1.2s cubic-bezier(.16, 1, .3, 1)
        }

        .conf-zones {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: .08em
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, .07);
            margin: 16px 20px
        }

        .images-wrap {
            padding: 0 20px;
            margin-bottom: 14px
        }

        .sec {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--muted);
            margin-bottom: 8px
        }

        .images-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .img-box {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            line-height: 0;
            background: var(--surface)
        }

        .img-label {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            padding: 5px 8px 3px;
            line-height: 1
        }

        .img-label.heat {
            color: var(--uncertain)
        }

        .img-box img {
            display: block;
            width: 100%;
            height: 130px;
            object-fit: cover
        }

        .img-box.single img {
            height: auto;
            max-height: 200px;
            object-fit: contain
        }

        .epilogue {
            font: italic 12px var(--serif);
            color: rgba(255, 255, 255, .4);
            text-align: center;
            padding: 0 20px 8px
        }

        .feedback-line,
        .feedback-noted {
            text-align: center;
            padding: 0 20px 4px
        }

        .feedback-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 9px;
            color: rgba(255, 255, 255, .35);
            text-transform: uppercase;
            letter-spacing: .08em
        }

        .feedback-btn {
            background: transparent;
            border: 0;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            min-width: 40px;
            min-height: 40px;
            color: rgba(255, 255, 255, .35);
            border-radius: 4px;
            transition: color .2s
        }

        .feedback-btn.up:hover {
            color: var(--real)
        }

        .feedback-btn.down:hover {
            color: var(--ai)
        }

        .feedback-noted {
            font: italic 12px var(--serif);
            color: rgba(255, 255, 255, .4)
        }

        .actions {
            display: flex;
            gap: 8px;
            padding: 10px 20px 18px
        }

        .btn-primary {
            flex: 1;
            padding: 9px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            transition: border-color .2s, color .2s;
            letter-spacing: .04em
        }

        .btn-primary:hover {
            border-color: var(--border-hi);
            color: var(--text)
        }

        .btn-close {
            padding: 9px 14px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 5px;
            color: var(--muted);
            font-size: 10px;
            cursor: pointer;
            transition: color .2s
        }

        .btn-close:hover {
            color: var(--text)
        }

        a:focus-visible,
        button:focus-visible {
            outline: 1px solid var(--text);
            outline-offset: 2px
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="topbar"><span class="wordmark">AI or Not AI</span><span class="mode-tag" id="modeTag"></span></div>

    <div id="view-loading" role="status" aria-live="polite">
        <div class="hourglass" aria-hidden="true">⌛</div>
        <div class="status-text" id="loadingText">The plot thickens...</div>
    </div>

    <div id="view-error" role="alert">
        <div class="err-msg" id="errMsg">A tragedy of errors occurred.</div>
        <button class="btn-close" id="btnCloseErr">Close</button>
    </div>

    <div id="view-result">
        <section class="broadside" aria-label="Verdict">
            <div class="ornament" aria-hidden="true">❧ ❦ ❧</div>
            <div class="verdict" id="verdict"></div>
            <div class="heraldry" id="heraldry"></div>
            <div class="sub" id="verdictSub"></div>
            <div class="rule-line" aria-hidden="true">─ ─ ─ ─ ─ ─ ─ ─ ─ ─</div>
            <div class="meta" id="meta"></div>
            <div class="rule-line" aria-hidden="true">─ ─ ─ ─ ─ ─ ─ ─ ─ ─</div>
        </section>

        <div class="conf">
            <div class="conf-row"><span class="conf-label">Soliloquy</span><span class="conf-score"
                    id="confScore"></span></div>
            <div class="conf-track">
                <div class="conf-marker" id="confMarker"></div>
            </div>
            <div class="conf-zones"><span>Real</span><span>Uncertain</span><span>AI</span></div>
        </div>
        <hr />
        <div id="imagesArea"></div>
        <div class="epilogue" id="epilogue"></div>
        <div id="feedback"></div>
        <div class="actions">
            <a class="btn-primary" id="btnPlayground" href="#" target="_blank" rel="noopener">Open full analysis →</a>
            <button class="btn-close" id="btnClose">Close</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="results.js"></script>
</body>

</html>
