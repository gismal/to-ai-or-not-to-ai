<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI or Not — Result</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0A0A0F;
            --surface: #1A1A24;
            --border: #2A2A3A;
            --text: #F0F0F0;
            --muted: #8888A0;
            --ai: #6C63FF;
            --real: #22D3A5;
            --uncertain: #FF9F43;
            --danger: #FF6B6B;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }

        h1,
        h2,
        h3,
        .mono {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ── Loading ── */
        #view-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 16px;
            color: var(--muted);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--ai);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Error ── */
        #view-error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 12px;
            text-align: center;
        }

        .error-icon {
            font-size: 2rem;
        }

        .error-msg {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--danger);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--danger);
            font-size: 0.85rem;
            line-height: 1.5;
            max-width: 340px;
        }

        /* ── Results ── */
        #view-results {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeUp .3s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .verdict-label {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .verdict-label.ai {
            color: var(--ai);
        }

        .verdict-label.real {
            color: var(--real);
        }

        .verdict-label.uncertain {
            color: var(--uncertain);
        }

        .filename {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timing {
            font-size: 0.72rem;
            color: var(--muted);
            text-align: right;
            margin-top: 2px;
        }

        /* Confidence bar */
        .conf-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .conf-row .score {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

        .bar-track {
            height: 7px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 99px;
            width: 0%;
            transition: width .9s cubic-bezier(.16, 1, .3, 1);
        }

        .bar-fill.ai {
            background: var(--ai);
        }

        .bar-fill.real {
            background: var(--real);
        }

        .bar-fill.uncertain {
            background: var(--uncertain);
        }

        .zone-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.67rem;
            color: var(--muted);
            margin-top: 5px;
        }

        .zone-labels .mid {
            color: var(--uncertain);
        }

        /* Images */
        .images-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .img-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .img-box .img-label {
            font-size: 0.7rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: 7px 10px 4px;
        }

        .img-box img {
            display: block;
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        /* Single image (no heatmap) */
        .image-single {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .image-single img {
            display: block;
            width: 100%;
            max-height: 200px;
            object-fit: contain;
        }

        /* Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--ai);
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-primary:hover {
            opacity: .85;
        }

        .btn-secondary {
            width: 100%;
            padding: 9px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color .15s;
        }

        .btn-secondary:hover {
            border-color: var(--ai);
            color: var(--text);
        }

        .cached-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 0.7rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            background: rgba(108, 99, 255, .15);
            color: var(--ai);
            border: 1px solid var(--ai);
            margin-left: 8px;
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div id="view-loading">
        <div class="spinner"></div>
        <p id="loading-msg">Fetching image…</p>
    </div>

    <!-- Error -->
    <div id="view-error">
        <div class="error-icon">⚠️</div>
        <div class="error-msg" id="error-msg"></div>
        <button class="btn-secondary" onclick="window.close()">Close</button>
    </div>

    <!-- Results -->
    <div id="view-results">
        <div class="result-header">
            <div>
                <div class="verdict-label" id="verdict-label">—</div>
                <span id="cached-tag" style="display:none" class="cached-tag">⚡ cached</span>
            </div>
            <div>
                <div class="filename" id="filename"></div>
                <div class="timing" id="timing"></div>
            </div>
        </div>

        <!-- Confidence bar -->
        <div>
            <div class="conf-row">
                <span>Confidence</span>
                <span class="score" id="conf-score"></span>
            </div>
            <div class="bar-track">
                <div class="bar-fill" id="bar-fill"></div>
            </div>
            <div class="zone-labels">
                <span>← REAL</span>
                <span class="mid">UNCERTAIN</span>
                <span>AI →</span>
            </div>
        </div>

        <!-- Image(s) -->
        <div id="images-container"></div>

        <!-- Actions -->
        <div class="actions">
            <a class="btn-primary" id="btn-playground" href="#" target="_blank">
                Open full analysis in playground →
            </a>
            <button class="btn-secondary" onclick="window.close()">Close</button>
        </div>
    </div>

    <script src="results.js"></script>
</body>

</html>
