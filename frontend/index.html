<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI or Not AI, That's the Question</title>
  <meta name="description" content="An AI image detector that admits when it isn't sure." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AI or Not AI, That's the Question" />
  <meta property="og:description" content="Five verdicts, a GradCAM heatmap, and an honest uncertainty zone." />
  <meta property="og:url" content="https://to-ai-or-not-to-ai.onrender.com/" />
  <meta property="og:image" content="https://to-ai-or-not-to-ai.onrender.com/static/og.png" />
  <meta property="og:image:alt" content="AI or Not AI: an image detector with an honest uncertainty zone" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://to-ai-or-not-to-ai.onrender.com/static/og.png" />
  <link rel="icon" href="/static/favicon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0d0d0f;
      --surface: #131316;
      --border: #2a2a32;
      --border-hi: #555562;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --dim: #7a7a85;
      --ai: #c0392b;
      --real: #27ae60;
      --uncertain: #d4a017;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --font-serif: 'IM Fell English', serif
    }

    html {
      scroll-behavior: smooth
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 var(--font-mono);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    body.first-folio {
      --bg: #19130a;
      --surface: #211a0d;
      --border: #5a4a2a;
      --border-hi: #8a7255;
      --text: #f0e4c4;
      --muted: #b89c70;
      --dim: #a08560
    }

    body.first-folio .topbar {
      background: rgba(25, 19, 10, .9)
    }

    button {
      font-family: inherit
    }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 52px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      background: rgba(13, 13, 15, .85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px
    }

    .wordmark {
      background: none;
      border: 0;
      color: inherit;
      font: 600 14px var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .15em;
      cursor: pointer
    }

    .seg {
      display: flex;
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 20px;
      padding: 4px;
      gap: 2px
    }

    .seg-btn {
      padding: 4px 16px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color .2s, color .2s
    }

    .seg-btn.on {
      background: var(--text);
      color: var(--bg)
    }

    .topbar-right {
      position: relative;
      display: flex;
      align-items: center
    }

    .access-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      padding: 4px 12px;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      transition: border-color .2s, color .2s
    }

    .access-chip:hover {
      border-color: var(--border-hi);
      color: var(--text)
    }

    .access-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim)
    }

    .access-dot.own {
      background: var(--real)
    }

    .access-pop {
      position: absolute;
      right: 0;
      top: calc(100% + 14px);
      width: 270px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      padding: 14px;
      z-index: 120
    }

    .access-note {
      font: italic 14px/1.5 var(--font-serif);
      color: var(--muted);
      margin-bottom: 12px
    }

    .access-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px
    }

    .link-btn {
      background: none;
      border: 0;
      color: var(--muted);
      font: italic 13px var(--font-serif);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .link-btn:hover {
      color: var(--text)
    }

    /* Layout */
    .main {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 24px 80px;
      position: relative
    }

    .act-label {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 48px 0 22px;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: .25em;
      color: rgba(255, 255, 255, .45);
      user-select: none
    }

    .act-label::before,
    .act-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .05)
    }

    /* Hero */
    .playbill {
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 80px;
      position: relative;
      opacity: 0;
      animation: fadeIn 2s ease-out forwards
    }

    .playbill.compact {
      min-height: 0;
      padding: 40px 24px 0;
      animation-duration: .4s
    }

    .playbill.compact .scroll-cue,
    .playbill.compact .playbill-byline,
    .playbill.compact .playbill-edition {
      display: none
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .playbill-portrait {
      width: 88px;
      height: auto;
      filter: sepia(.35) contrast(1.1);
      cursor: pointer;
      transition: filter .4s;
      margin-bottom: 28px
    }

    .playbill-portrait:hover {
      filter: sepia(.1) contrast(1.2) brightness(1.05)
    }

    body.first-folio .playbill-portrait {
      filter: sepia(.8) contrast(1.1)
    }

    .ornament {
      font-family: var(--font-serif);
      color: rgba(255, 255, 255, .14);
      font-size: 22px;
      letter-spacing: .6em;
      margin: 18px 0;
      user-select: none
    }

    .playbill-quote {
      font: italic 400 clamp(1.9rem, 4.5vw, 3rem)/1.2 var(--font-serif);
      letter-spacing: .01em;
      max-width: 520px;
      margin-bottom: 14px
    }

    .playbill-attribution {
      font-size: 12px;
      color: rgba(255, 255, 255, .55);
      text-transform: uppercase;
      letter-spacing: .25em;
      margin-bottom: 28px
    }

    .playbill-plain {
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 420px;
      margin: 0 auto 26px
    }

    .playbill.compact .playbill-plain {
      margin-bottom: 8px
    }

    .playbill-byline {
      font: italic 16px var(--font-serif);
      color: rgba(255, 255, 255, .55);
      margin-bottom: 6px
    }

    .playbill-edition {
      font-size: 10px;
      color: rgba(255, 255, 255, .5);
      text-transform: uppercase;
      letter-spacing: .3em
    }

    .scroll-cue {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: 0;
      color: rgba(255, 255, 255, .5);
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: .2em;
      cursor: pointer;
      animation: scrollPulse 2.5s infinite ease-in-out
    }

    @keyframes scrollPulse {

      0%,
      100% {
        opacity: .5;
        transform: translateX(-50%)
      }

      50% {
        opacity: 1;
        transform: translateX(-50%) translateY(6px)
      }
    }

    /* Drop zone */
    .drop {
      border: 1px dashed rgba(255, 255, 255, .12);
      border-radius: 8px;
      text-align: center;
      position: relative;
      background: var(--surface);
      overflow: hidden;
      transition: border-color .25s, background .25s
    }

    .drop.empty {
      padding: 60px 24px
    }

    .drop:hover,
    .drop.over {
      border-color: rgba(255, 255, 255, .5);
      background: rgba(255, 255, 255, .03)
    }

    .drop input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }

    .drop-primary {
      font: italic 22px var(--font-serif);
      margin-bottom: 6px
    }

    .drop-hint {
      font-size: 11px;
      color: var(--muted)
    }

    .gloss-anchor {
      position: relative
    }

    .gloss {
      display: none
    }

    @media (min-width:960px) {
      .main {
        max-width: 680px
      }

      .gloss {
        display: block;
        position: absolute;
        right: -210px;
        top: 0;
        width: 186px;
        font: italic larger var(--font-serif);
        color: rgba(255, 255, 255, .5);
        line-height: 1.7;
        border-left: 1px solid rgba(255, 255, 255, .05);
        padding-left: 14px
      }
    }

    /* Sample images */
    .samples {
      margin-top: 22px;
      text-align: center
    }

    .samples-label {
      font: italic 13px var(--font-serif);
      color: var(--muted);
      margin-bottom: 10px
    }

    .samples-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .sample {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0;
      width: min(112px, calc((100vw - 56px) / 3));
      cursor: pointer;
      overflow: hidden;
      color: var(--muted);
      transition: border-color .2s, color .2s
    }

    .sample:hover {
      border-color: var(--border-hi);
      color: var(--text)
    }

    .sample img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center 25%
    }

    .sample span {
      display: block;
      font-size: 10px;
      padding: 5px 4px;
      letter-spacing: .04em
    }

    /* URL, inputs, buttons */
    .url-toggle {
      text-align: center;
      margin-top: 14px;
      font-size: 11px
    }

    .url-toggle>button {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--dim)
    }

    .url-toggle>button:hover {
      color: var(--text)
    }

    .url-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px
    }

    input[type=password],
    input[type=url] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font: 13px var(--font-mono);
      color: var(--text);
      outline: none;
      transition: border-color .2s
    }

    input:focus {
      border-color: var(--border-hi)
    }

    input::placeholder {
      color: var(--muted)
    }

    .btn-go,
    .btn-reset,
    .btn-retry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .2s, color .2s
    }

    .btn-go:hover,
    .btn-reset:hover,
    .btn-retry:hover {
      border-color: var(--border-hi);
      color: var(--text)
    }

    .btn-reset {
      flex: 1;
      padding: 12px;
      font-size: 12px
    }

    /* Error + loader */
    .err {
      font-size: 12px;
      color: #e0584a;
      background: rgba(192, 57, 43, .07);
      border: 1px solid rgba(192, 57, 43, .25);
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .err-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0
    }

    .loader-wrap {
      padding: 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px
    }

    .elapsed {
      font-size: 11px;
      color: var(--dim)
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    /* The scribe: a quill writes while the model thinks */
    .scribe {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 150px;
      --quill-fill: #3a372f
    }

    body.first-folio .scribe {
      --quill-fill: #4a3a22
    }

    .scribe-line {
      position: absolute;
      top: 54px;
      width: 0;
      overflow: hidden;
      white-space: nowrap;
      font: italic 18px/24px var(--font-serif);
      color: var(--text)
    }

    .scribe-ink {
      position: absolute;
      left: 12px;
      bottom: 8px;
      width: 28px;
      height: 26px
    }

    .quill {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      color: var(--text);
      transform-origin: 3px 37px;
      pointer-events: none
    }

    .scribe.still .scribe-line {
      position: static;
      width: auto;
      padding-top: 54px;
      text-align: center;
      white-space: normal
    }

    .scribe.still .quill {
      display: none
    }

    /* The curtain: shown while the free server wakes up */
    .stage-area {
      position: relative
    }

    .curtain-box {
      position: relative;
      width: 100%;
      height: 230px
    }

    .curtain {
      position: absolute;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      border-radius: 8px
    }

    .curtain.opening {
      pointer-events: none
    }

    .curtain-valance {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: #2e0d10;
      z-index: 3;
      transition: opacity .4s
    }

    .curtain-half {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 51%;
      background: #4a1519 repeating-linear-gradient(90deg, transparent 0 13px, #3c1014 13px 14px);
      transform-origin: 50% 0;
      animation: sway 4.5s ease-in-out infinite;
      transition: width 1.3s cubic-bezier(.6, 0, .2, 1), clip-path 1.3s cubic-bezier(.6, 0, .2, 1), opacity .3s 1.1s
    }

    .curtain-half.left {
      left: 0;
      clip-path: polygon(0 0, 100% 0, 100% 60%, 100% 100%, 0 100%)
    }

    .curtain-half.right {
      right: 0;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 60%);
      animation-direction: reverse
    }

    .curtain.opening .curtain-half.left {
      width: 12%;
      clip-path: polygon(0 0, 100% 0, 35% 60%, 70% 100%, 0 100%);
      opacity: 0
    }

    .curtain.opening .curtain-half.right {
      width: 12%;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 30% 100%, 65% 60%);
      opacity: 0
    }

    @keyframes sway {

      0%,
      100% {
        rotate: 0deg
      }

      50% {
        rotate: 1deg
      }
    }

    .curtain-spot {
      position: absolute;
      top: 50%;
      width: 150px;
      height: 150px;
      margin: -75px 0 0 -75px;
      border-radius: 50%;
      background: rgba(240, 228, 196, .07);
      z-index: 2;
      animation: spot 6s ease-in-out infinite;
      transition: opacity .4s
    }

    @keyframes spot {

      0%,
      100% {
        left: 28%
      }

      50% {
        left: 72%
      }
    }

    .curtain-copy {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
      transition: opacity .4s
    }

    .curtain.opening .curtain-copy,
    .curtain.opening .curtain-spot,
    .curtain.opening .curtain-valance {
      opacity: 0
    }

    .curtain-line {
      font: italic 22px/1.3 var(--font-serif);
      color: #f0e4c4;
      animation: fadeIn .6s ease
    }

    .curtain-note {
      font-size: 11px;
      line-height: 1.6;
      color: rgba(240, 228, 196, .65);
      max-width: 300px
    }

    .curtain-copy .elapsed {
      color: rgba(240, 228, 196, .5)
    }

    /* Verdict */
    .broadside {
      text-align: center
    }

    @media (min-width:769px) {
      .broadside {
        animation: curtain .7s cubic-bezier(.16, 1, .3, 1) both
      }

      @keyframes curtain {
        from {
          clip-path: inset(0 50% 0 50%);
          opacity: 0
        }

        to {
          clip-path: inset(0);
          opacity: 1
        }
      }
    }

    @media (max-width:768px) {
      .broadside {
        animation: fadeUp .4s ease
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px)
        }

        to {
          opacity: 1;
          transform: none
        }
      }
    }

    .broadside-ornament {
      font-family: var(--font-serif);
      color: rgba(255, 255, 255, .14);
      font-size: 20px;
      letter-spacing: .5em;
      margin-bottom: 16px;
      user-select: none
    }

    .broadside-verdict {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: 8px
    }

    .broadside-verdict.ai {
      color: var(--ai)
    }

    .broadside-verdict.real {
      color: var(--real)
    }

    .broadside-verdict.uncertain {
      color: var(--uncertain)
    }

    .broadside-heraldry {
      font: italic 15px var(--font-serif);
      color: rgba(255, 255, 255, .6);
      letter-spacing: .08em;
      margin-bottom: 14px
    }

    .broadside-sub {
      font: italic 17px var(--font-serif);
      color: var(--muted);
      margin-bottom: 22px
    }

    .broadside-rule {
      color: rgba(255, 255, 255, .12);
      font-size: 10px;
      letter-spacing: .4em;
      margin: 10px 0;
      user-select: none
    }

    .broadside-meta {
      font-size: 13px;
      color: rgba(255, 255, 255, .6);
      margin-bottom: 22px
    }

    .serif-detail {
      font: italic 17px var(--font-serif)
    }

    .sep {
      margin: 0 10px;
      color: rgba(255, 255, 255, .2)
    }

    .conf {
      text-align: left
    }

    .conf-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px
    }

    .conf-label {
      font: italic 12px var(--font-serif);
      color: var(--muted)
    }

    .conf-score {
      font-size: 12px;
      font-weight: 600
    }

    .conf-track {
      position: relative;
      height: 4px;
      border-radius: 2px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, rgba(39, 174, 96, .55), rgba(212, 160, 23, .55) 55%, rgba(192, 57, 43, .55))
    }

    .conf-marker {
      position: absolute;
      top: -4px;
      width: 2px;
      height: 12px;
      background: var(--text);
      transform: translateX(-50%);
      transition: left 1.4s cubic-bezier(.16, 1, .3, 1)
    }

    .conf-zones {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 600;
      margin-bottom: 28px
    }

    .zone-tip {
      position: relative;
      cursor: help
    }

    .zone-tip::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #1c1c22;
      border: 1px solid var(--border-hi);
      border-radius: 5px;
      padding: 8px 12px;
      font: italic 400 11px/1.6 var(--font-serif);
      color: var(--text);
      width: min(230px, 80vw);
      text-align: center;
      white-space: normal;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 50;
      text-transform: none;
      letter-spacing: 0
    }

    .conf-zones .zone-tip:first-child::after {
      left: 0;
      transform: none;
      text-align: left
    }

    .conf-zones .zone-tip:last-child::after {

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ── Config ── */
    const DEMO_KEY = 'demo-public';      // must equal DEMO_API_KEY on the server
    const KEY_STORE = 'aon_key';
    const MAX_PX = 1500;
    const UPLOAD_TYPES = ['image/jpeg', 'image/png'];
    const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];

    const LABELS = {
      REAL: 'Human Made', AI_GENERATED: 'AI Generated',
      UNCERTAIN_LEANING_AI: 'Uncertain - Leaning AI', UNCERTAIN_LEANING_REAL: 'Uncertain - Leaning Real',
      UNCERTAIN_NEUTRAL: 'Uncertain',
    };
    const SUBS = {
      REAL: 'Born of mortal hands.', AI_GENERATED: "A machine's cold forgery.",
      UNCERTAIN_LEANING_AI: 'Methinks the lady doth protest too much.',
      UNCERTAIN_LEANING_REAL: 'There are more things in heaven and earth.',
      UNCERTAIN_NEUTRAL: 'Neither here nor there.',
    };
    const HERALDRY = { REAL: 'Vert', AI_GENERATED: 'Gules', UNCERTAIN_LEANING_AI: 'Or', UNCERTAIN_LEANING_REAL: 'Or', UNCERTAIN_NEUTRAL: 'Or' };
    const EPILOGUES = {
      AI_GENERATED: ["What's done cannot be undone.", 'All that glitters is not gold.', 'The lady doth protest too much, methinks.'],
      REAL: ["All's well that ends well.", 'Truth will come to light.', 'What a piece of work is a man.'],
      UNCERTAIN_LEANING_AI: ['The rest is silence.', 'Something is rotten in the state of Denmark.'],
      UNCERTAIN_LEANING_REAL: ['There are more things in heaven and earth.', 'Neither here nor there.'],
      UNCERTAIN_NEUTRAL: ['The rest is silence.', 'What light through yonder window breaks?'],
    };
    // Put these three files in frontend/samples/. Any that are missing are simply not shown.
    const SAMPLES = [
      { src: '/static/samples/real.jpg', label: 'A photograph' },
      { src: '/static/samples/ai.jpg', label: 'An AI image' },
      { src: '/static/samples/unsure.jpg', label: 'A hard case' },
    ];
    // Optional per sample: pos: 'center 10%' moves the crop (left-right, top-bottom).
    const WAKING_AFTER_S = 8;      // an analysis this slow means the server was asleep
    const COLD_AFTER_MS = 1500;    // a /health ping this slow on page load means the same

    // Written by the quill while the model thinks. Keep each under ~36 characters so it fits on a phone.
    const PUNS = [
  'To pixel, or not to pixel…',
  'Is this a deepfake I see before me?',
  'Out, damned artifact!',
  'Fair is foul, and foul is fair…',
  'A rose by any other prompt…',
  'All that glitters is not real.',
  'Brevity is the soul of inference.',
  "There's method in this noise.",
  'Something is rotten in the metadata.',
  'Holding the mirror up to nature…',
];
    // Shown on the curtain while the free server wakes up.
    const WAKING_LINES = [
  'Places, please…',
  'Now is the winter of our cold start.',
  'To sleep, perchance to boot…',
  'What light through yonder server wakes?',
  'Wake! Ring the alarum bell!',
  'The players are still in costume.',
  'Though patience be a tired mare…',
  'Lend me your ears, and a minute.',
  'Parting is such sweet latency.',
  "All the world's a stage. This one's loading.",
];

    const EXT_ACTS = [
      ['Act I', 'Install the extension', 'Load from the Chrome Web Store or install unpacked via developer mode.'],
      ['Act II', 'Ready from the first moment', 'The public demo is built in. For higher limits, add your own server or key under "Use your own server or key" in the popup.'],
      ['Act III', 'Right-click any image', 'Summon the detector on any canvas across the wide web.'],
      ['Act IV', 'Behold the verdict', 'A popup reveals the truth: confidence scores and GradCAM heatmaps.'],
      ['Act V', 'Enable passive mode', 'Let the extension badge AI images silently as you browse, without a right-click.'],
    ];

    /* ── Helpers ── */
    const storage = (name) => ({
      get(k) { try { return window[name].getItem(k); } catch { return null; } },
      set(k, v) { try { window[name].setItem(k, v); } catch { /* storage unavailable */ } },
    });
    const local = storage('localStorage');
    const session = storage('sessionStorage');

    const isUrl = (s) => /^https?:\/\//i.test(s || '');
    const isTyping = (el) => !!el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable);
    const vcls = (p) => (p === 'REAL' ? 'real' : p === 'AI_GENERATED' ? 'ai' : 'uncertain');
    const isDefinite = (p) => p === 'REAL' || p === 'AI_GENERATED';
    // The API returns P(AI). For a Human Made verdict the model's certainty is 1 - P(AI).
    const certainty = (p, c) => (p === 'REAL' ? 1 - c : c);

    const httpMessage = (status, demo) => ({
      400: 'Unsupported or unreadable image. Try a JPEG or PNG.',
      401: demo ? 'The demo key was refused. Please try again later.' : 'That key was not recognised.',
      413: 'The file is too large, even after resizing.',
      429: demo ? 'The demo is catching its breath. Wait a moment, or add your own key for higher limits.'
        : 'Rate limit reached. Wait a moment and try again.',
    }[status] || `The server answered ${status}.`);

    function formatFilename(name) {
      if (!name) return 'unknown.jpg';
      if (name.length > 30 || name.includes('?q=') || name.includes('base64')) return 'pasted_image.jpg';
      if (name.length > 20) {
        const parts = name.split('.');
        const ext = parts.length > 1 ? '.' + parts.pop() : '';
        return parts.join('.').substring(0, 15) + '...' + ext;
      }
      return name;
    }

    // Maps a vote to what the user believes the true label is.
    function deriveUserCorrection(prediction, vote) {
      if (vote === 'agree') return isDefinite(prediction) ? prediction : 'UNKNOWN';
      if (prediction === 'AI_GENERATED') return 'REAL';
      if (prediction === 'REAL') return 'AI_GENERATED';
      if (prediction === 'UNCERTAIN_LEANING_AI') return 'REAL';
      if (prediction === 'UNCERTAIN_LEANING_REAL') return 'AI_GENERATED';
      return 'UNKNOWN';
    }

    // Re-encodes anything the browser can decode (WebP, AVIF, GIF...) and shrinks large files.
    function normalizeImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const { naturalWidth: w, naturalHeight: h } = img;
          if (UPLOAD_TYPES.includes(file.type) && Math.max(w, h) <= MAX_PX) return resolve(file);
          const scale = Math.min(1, MAX_PX / Math.max(w, h));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';                       // avoid black backgrounds on transparent images
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(
            (blob) => blob
              ? resolve(new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }))
              : reject(new Error('Could not prepare the image.')),
            'image/jpeg', 0.92);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This image could not be read by the browser.')); };
        img.src = url;
      });
    }

    async function fetchImage(url, signal) {
      let res;
      try { res = await fetch(url, { signal }); }
      catch (e) {
        if (signal?.aborted) throw e;
        throw new Error('The image server blocks browser requests (CORS). Download the image and upload it directly.');
      }
      if (!res.ok) throw new Error(`Could not fetch the image (HTTP ${res.status}).`);
      const blob = await res.blob();
      if (!blob.type.startsWith('image/')) throw new Error('That address does not point to an image.');
      return new File([blob], url.split('?')[0].split('/').pop() || 'image', { type: blob.type });
    }

    function droppedImage(dt) {
      const files = [...dt.files].filter((f) => f.type.startsWith('image/'));
      if (files.length) return { files };
      const html = dt.getData('text/html');
      const src = html && new DOMParser().parseFromString(html, 'text/html').querySelector('img')?.src;
      if (isUrl(src)) return { url: src };
      const uri = dt.getData('text/uri-list').split('\n').find(isUrl);
      if (uri) return { url: uri.trim() };
      const text = dt.getData('text/plain').trim();
      return isUrl(text) ? { url: text } : {};
    }

    const shuffled = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(([, v]) => v);

    // The engraved quill, drawn once. The nib is at (3, 37) in its 40×40 box.
    const QUILL_SVG = (() => {
      const N = 30, W = 8.5, BOW = 1.8, n = 0.707, pts = [];
      for (let i = 0; i <= N; i++) {
        const t = 0.2 + 0.8 * i / N, b = BOW * Math.sin(Math.PI * t);
        const px = 3 + 35 * t - n * b, py = 37 - 35 * t - n * b;
        const u = Math.min(1, (t - 0.2) / 0.8);
        const w = W * Math.pow(Math.sin(Math.PI * Math.min(0.999, u * 0.92 + 0.04)), 0.65) * (u > 0.85 ? 1 - (u - 0.85) * 3 : 1);
        const j = i === 11 || i === 19 ? 0.35 : 0;                 // two notches in the vane
        pts.push({ px, py, ux: px - n * w * (1 - j), uy: py - n * w * (1 - j), lx: px + n * w * 0.72 * (1 - j * 0.8), ly: py + n * w * 0.72 * (1 - j * 0.8) });
      }
      const f = (v) => v.toFixed(1);
      const vane = 'M' + pts.map((p) => `${f(p.ux)} ${f(p.uy)}`).join(' L') + ' L' + [...pts].reverse().map((p) => `${f(p.lx)} ${f(p.ly)}`).join(' L') + 'Z';
      let barbs = '';
      for (let i = 3; i < N - 1; i += 2) {
        const p = pts[i], q = pts[i - 2];
        barbs += `M${f(p.px)} ${f(p.py)} L${f(q.ux + (p.ux - q.ux) * 0.2)} ${f(q.uy + (p.uy - q.uy) * 0.2)} M${f(p.px)} ${f(p.py)} L${f(q.lx)} ${f(q.ly)} `;
      }
      const shaft = 'M3 37 ' + pts.map((p) => `L${f(p.px)} ${f(p.py)}`).join(' ');
      const b = pts[1];
      const wisps = `M${f(b.px)} ${f(b.py)} q-3.5 .5 -5 3.5 M${f(b.px)} ${f(b.py)} q.5 3.5 -1.5 5.5 M${f(pts[2].px)} ${f(pts[2].py)} q-4 -1 -6 1`;
      return `<svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">`
        + `<path d="${vane}" style="fill:var(--quill-fill)" stroke-width="1.35"/><path d="${barbs}" stroke-width=".7"/>`
        + `<path d="${wisps}" stroke-width=".8"/><path d="${shaft}" stroke-width="1.35"/><path d="M3 37 L9.5 30.5" stroke-width="1.8"/></svg>`;
    })();

    /* ── Components ── */
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { failed: false }; }
      static getDerivedStateFromError() { return { failed: true }; }
      render() {
        if (!this.state.failed) return this.props.children;
        return (
          <div style={{ padding: '20vh 24px', textAlign: 'center', font: 'italic 20px var(--font-serif)', color: 'var(--muted)' }}>
            <p style={{ marginBottom: 16 }}>A tragedy of errors befell the stage.</p>
            <button className="btn-go" onClick={() => location.reload()}>Raise the curtain again</button>
          </div>
        );
      }
    }

    function AccessMenu({ apiKey, open, setOpen, onSave }) {
      const [draft, setDraft] = useState('');
      const box = useRef(null);
      const usingDemo = apiKey === DEMO_KEY;

      useEffect(() => {
        if (!open) return;
        const away = (e) => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
        const esc = (e) => { if (e.key === 'Escape') setOpen(false); };
        document.addEventListener('mousedown', away);
        document.addEventListener('keydown', esc);
        return () => { document.removeEventListener('mousedown', away); document.removeEventListener('keydown', esc); };
      }, [open, setOpen]);

      const save = (key) => { onSave(key || DEMO_KEY); setDraft(''); setOpen(false); };

      return (
        <div className="topbar-right" ref={box}>
          <button className="access-chip" aria-haspopup="dialog" aria-expanded={open} onClick={() => setOpen(!open)}>
            <span className={`access-dot ${usingDemo ? '' : 'own'}`} />
            {usingDemo ? <>Demo<span className="hide-sm"> access</span></> : <><span className="hide-sm">Your </span>key</>}
          </button>
          {open && (
            <div className="access-pop" role="dialog" aria-label="Access">
              <p className="access-note">Anyone may use the public demo, within limits. Hold your own key? Enter it for higher limits.</p>
              <input type="password" placeholder="Your access key" value={draft} autoFocus autoComplete="off"
                aria-label="Access key" onChange={(e) => setDraft(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && save(draft.trim())} />
              <div className="access-actions">
                <button className="btn-go" onClick={() => save(draft.trim())}>Save</button>
                {!usingDemo && <button className="link-btn" onClick={() => save(DEMO_KEY)}>Use demo access</button>}
              </div>
            </div>
          )}
        </div>
      );
    }

    function GradSlider({ original, heatmap }) {
      const [pos, setPos] = useState(50);
      const ref = useRef(null);
      const frame = useRef(0);

      const setFromX = (x) => {
        cancelAnimationFrame(frame.current);
        frame.current = requestAnimationFrame(() => {
          if (!ref.current) return;
          const r = ref.current.getBoundingClientRect();
          setPos(Math.min(100, Math.max(0, ((x - r.left) / r.width) * 100)));
        });
      };
      useEffect(() => () => cancelAnimationFrame(frame.current), []);

      return (
        <>
          <div className="sec">The Mousetrap</div>
          <div ref={ref} className="slider" role="slider" tabIndex={0}
            aria-label="Compare the original image with the heatmap"
            aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(pos)}
            onPointerDown={(e) => { e.currentTarget.setPointerCapture(e.pointerId); setFromX(e.clientX); }}
            onPointerMove={(e) => { if (e.currentTarget.hasPointerCapture(e.pointerId)) setFromX(e.clientX); }}
            onKeyDown={(e) => {
              if (e.key === 'ArrowLeft') setPos((p) => Math.max(0, p - 5));
              if (e.key === 'ArrowRight') setPos((p) => Math.min(100, p + 5));
            }}>
            <img src={original} alt="Original" draggable={false} />

    // A quill writes one line, dips into the inkwell, and writes the next, until the verdict arrives.
    function Scribe({ first }) {
      const box = useRef(null);
      const line = useRef(null);
      const pen = useRef(null);

      useEffect(() => {
        const B = box.current, L = line.current, P = pen.current;
        const lines = [first, ...shuffled(PUNS)];
        let i = 0;

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          B.classList.add('still');
          L.textContent = lines[0];
          const id = setInterval(() => { i = (i + 1) % lines.length; L.textContent = lines[i]; }, 3500);
          return () => clearInterval(id);
        }

        const BASE = 72;                                       // where the nib touches the line
        const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
        const lerp = (a, b, p) => a + (b - a) * p;
        const ink = () => ({ x: 26, y: B.clientHeight - 24 });
        let phase = 'write', t0 = performance.now(), full = 0, sx = 0, nx = 0, ny = BASE, from = { x: 0, y: 0 }, raf = 0;

        const setLine = (text) => {
          L.textContent = text;
          L.style.width = 'auto'; full = L.scrollWidth; L.style.width = '0px'; L.style.opacity = 1;
          sx = Math.max(12, (B.clientWidth - full) / 2); L.style.left = `${sx}px`;
        };
        const nib = (x, y, r) => { nx = x; ny = y; P.style.transform = `translate(${x - 3}px, ${y - 37}px) rotate(${r}deg)`; };
        const go = (p, now) => { phase = p; t0 = now; };

        const frame = (now) => {
          const el = now - t0;
          if (phase === 'write') {
            const p = Math.min(1, el / Math.max(700, L.textContent.length * 38)), w = full * p;
            L.style.width = `${w}px`;
            nib(sx + w, BASE + Math.sin(now / 80) * 1.2, Math.sin(now / 60) * 5);
            if (p >= 1) go('hold', now);
          } else if (phase === 'hold') {
            nib(nx, ny, 0);
            if (el > 1300) { from = { x: nx, y: ny }; go('toInk', now); }
          } else if (phase === 'toInk') {
            const p = Math.min(1, el / 600), e = ease(p), k = ink();
            nib(lerp(from.x, k.x, e), lerp(from.y, k.y, e) - 35 * Math.sin(Math.PI * p), -10 * e);
            L.style.opacity = 1 - p;
            if (p >= 1) go('dip', now);
          } else if (phase === 'dip') {
            const p = Math.min(1, el / 500), k = ink();
            nib(k.x, k.y + 7 * Math.abs(Math.sin(p * 2 * Math.PI)), -10);
            if (p >= 1) { i = (i + 1) % lines.length; setLine(lines[i]); from = { x: nx, y: ny }; go('toStart', now); }
          } else {
            const p = Math.min(1, el / 500), e = ease(p);
            nib(lerp(from.x, sx, e), lerp(from.y, BASE, e) - 30 * Math.sin(Math.PI * p), lerp(-10, 0, e));
            if (p >= 1) go('write', now);
          }
          raf = requestAnimationFrame(frame);
        };

        setLine(lines[0]);
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [first]);

      return (
        <div className="scribe" ref={box} aria-hidden="true">
          <svg className="scribe-ink" viewBox="0 0 24 22">
            <path d="M3 21 C2 13 6 9 9 8 L15 8 C18 9 22 13 21 21z" style={{ fill: 'var(--border)' }} />
            <rect x="8" y="4" width="8" height="5" rx="1" style={{ fill: 'var(--border-hi)' }} />
          </svg>
          <div className="scribe-line" ref={line} />
          <div className="quill" ref={pen} dangerouslySetInnerHTML={{ __html: QUILL_SVG }} />
        </div>
      );
    }

    // A closed curtain with rotating lines while the free server wakes up; `opening` gathers it to the sides.
    function Curtain({ since, opening = false, live = false }) {
      const [secs, setSecs] = useState(() => Math.floor((Date.now() - since) / 1000));
      const [i, setI] = useState(0);
      useEffect(() => {
        const tick = setInterval(() => setSecs(Math.floor((Date.now() - since) / 1000)), 1000);
        const rotate = setInterval(() => setI((n) => (n + 1) % WAKING_LINES.length), 4000);
        return () => { clearInterval(tick); clearInterval(rotate); };
      }, [since]);

      return (
        <div className={`curtain ${opening ? 'opening' : ''}`}>
          <div className="curtain-half left" aria-hidden="true" />
          <div className="curtain-half right" aria-hidden="true" />
          <div className="curtain-valance" aria-hidden="true" />
          <div className="curtain-spot" aria-hidden="true" />
          <div className="curtain-copy">
            <div className="curtain-line" key={i} aria-hidden="true">{WAKING_LINES[i]}</div>
            <div className="curtain-note" role={live ? 'status' : undefined}>
              The server naps when idle, so the first visit can take up to a minute. Later verdicts come quickly.
            </div>
            <div className="elapsed" aria-hidden="true">{secs}s</div>
          </div>
        </div>
      );
    }

    function Verdict({ result, mode, preview, round, feedback, onFeedback, onExeunt }) {
      const [pos, setPos] = useState(0);
      const { prediction: pred, confidence } = result;
      const cls = vcls(pred);
      const lines = EPILOGUES[pred] || ['The rest is silence.'];

      useEffect(() => {
        const t = setTimeout(() => setPos(confidence * 100), 60);

          <div className="broadside-rule" aria-hidden="true">─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─</div>
          <div className="broadside-meta">
            <span>{formatFilename(result.filename)}</span><span className="sep">·</span>

            <span>{result.processing_time_ms} ms</span>

          <div className="gloss-anchor conf">

            <div className="conf-zones">

              <span className="zone-tip" tabIndex={0} data-tip="The Justice: in fair round belly, weighing all sides with scholarly indecision.">Uncertain</span>
              <span className="zone-tip" tabIndex={0} data-tip="Second childishness: mere oblivion, generated by machine and naught else.">AI</span>

            : preview && <><div className="sec">Analyzed Image</div><div className="img-box"><img src={preview} alt="The analyzed image" /></div></>}

          <div className="epilogue">{lines[round % lines.length]}</div>
          {feedback ? (

          ) : (

              <button className="feedback-btn up" aria-label="Correct verdict" title="Correct (C)" onClick={() => onFeedback('agree')}>↑</button>
              <button className="feedback-btn down" aria-label="Wrong verdict" title="Wrong (W)" onClick={() => onFeedback('disagree')}>↓</button>
            </div>

    /* ── App ── */
    function App() {
      const [apiKey, setApiKey] = useState(() => local.get(KEY_STORE) || DEMO_KEY);
      const [accessOpen, setAccessOpen] = useState(false);
      const [mode, setMode] = useState('explain');
      const [loading, setLoading] = useState(false);
      const [elapsed, setElapsed] = useState('0.0');
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [errCode, setErrCode] = useState(null);
      const [preview, setPreview] = useState(null);
      const [showUrl, setShowUrl] = useState(false);
      const [urlInput, setUrlInput] = useState('');
      const [round, setRound] = useState(0);
      const [feedback, setFeedback] = useState(null);       // null | 'agree' | 'disagree' | 'failed'
      const [heroSeen, setHeroSeen] = useState(() => session.get('aon_hero') === '1');
      const [folio, setFolio] = useState(() => local.get('aon_folio') === '1');
      const [showSoliloquy, setShowSoliloquy] = useState(false);
      const [server, setServer] = useState('unknown');        // 'unknown' | 'cold' | 'opening' | 'warm'

      const toolRef = useRef(null);
      const timer = useRef(0);
      const runStart = useRef(0);
      const pageStart = useRef(Date.now());
      const ctrl = useRef(null);                             // aborts the in-flight analysis
      const konami = useRef(0);
      const folioClicks = useRef({ n: 0, t: 0 });
      const latest = useRef({});                             // always-fresh handlers for window listeners
      const usingDemo = apiKey === DEMO_KEY;

      const scrollToTool = (block = 'start') =>
        setTimeout(() => toolRef.current?.scrollIntoView({ behavior: 'smooth', block }), 50);

      const clearState = () => {
        ctrl.current?.abort(); ctrl.current = null;
        clearInterval(timer.current); setLoading(false);
        setResult(null); setError(null); setErrCode(null); setPreview(null);
        setElapsed('0.0'); setFeedback(null);
      };
      const reset = () => { clearState(); setShowUrl(false); setUrlInput(''); scrollToTool(); };
      const home = () => { clearState(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const chooseMode = (m) => { setMode(m); reset(); };
      const saveKey = (k) => { local.set(KEY_STORE, k); setApiKey(k); };

      const startTimer = () => {
        const t0 = Date.now();
        runStart.current = t0;
        clearInterval(timer.current);
        timer.current = setInterval(() => setElapsed(((Date.now() - t0) / 1000).toFixed(1)), 100);
      };

      const fail = (e) => {
        if (e.status) { setError(httpMessage(e.status, usingDemo)); setErrCode(e.status); }
        else if (e instanceof TypeError) { setError('Could not reach the server. It may be waking up, so try again in a moment.'); setErrCode(null); }
        else { setError(e.message); setErrCode(null); }
      };

      const run = async (getFile) => {
        if (latest.current.loading) return;
        clearState(); setHeroSeen(true); session.set('aon_hero', '1');
        const controller = new AbortController();
        ctrl.current = controller;
        const { signal } = controller;
        setLoading(true); startTimer();
        try {
          const file = await normalizeImage(await getFile(signal));
          if (signal.aborted) return;
          setPreview(URL.createObjectURL(file));
          const form = new FormData();
          form.append('file', file);
          const res = await fetch(`/v1/inference/${mode === 'explain' ? 'explain' : 'predict'}`, {
            method: 'POST', headers: { 'X-API-Key': apiKey.trim() }, body: form, signal,
          });
          if (!res.ok) throw Object.assign(new Error('http'), { status: res.status });
          const data = await res.json();
          if (signal.aborted) return;
          setResult(data);
          setRound((n) => n + 1);
        } catch (e) { if (!signal.aborted) fail(e); }
        finally {
          if (ctrl.current === controller) { ctrl.current = null; clearInterval(timer.current); setLoading(false); }
        }
      };
      const runFiles = (files) => { if (files?.length) run(async () => files[0]); };
      const runFromUrl = (url) => { if (url?.trim()) run((signal) => fetchImage(url.trim(), signal)); };

      const submitFeedback = async (vote) => {
        if (!result || feedback) return;
        setFeedback(vote);                                   // optimistic
        try {
          const res = await fetch('/v1/feedback/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey.trim() },
            body: JSON.stringify({
              filename: result.filename, model_prediction: result.prediction, confidence: result.confidence,
              user_correction: deriveUserCorrection(result.prediction, vote), client_source: 'playground_v2',
            }),
          });
          if (!res.ok) throw new Error('feedback rejected');
        } catch { setFeedback('failed'); }
      };

      const onPortrait = () => {
        const c = folioClicks.current;
        clearTimeout(c.t); c.n += 1;
        if (c.n >= 3) { c.n = 0; setFolio((f) => !f); } else c.t = setTimeout(() => { c.n = 0; }, 1800);
      };

      latest.current = { loading, result, feedback, showSoliloquy, runFiles, runFromUrl, reset, chooseMode, submitFeedback };

      /* Window listeners are registered once and read fresh handlers through `latest`. */
      useEffect(() => {
        const onKey = (e) => {
          const s = latest.current;
          if (s.showSoliloquy) { setShowSoliloquy(false); return; }
          if (e.ctrlKey || e.metaKey || e.altKey || isTyping(e.target)) return;
          if (e.key === KONAMI[konami.current]) {
            if (++konami.current === KONAMI.length) { konami.current = 0; setShowSoliloquy(true); }
          } else konami.current = 0;
          const k = e.key.toLowerCase();
          if (k === 'r') s.reset();
          else if (k === 'e') s.chooseMode('explain');
          else if (k === 'f') s.chooseMode('predict');
          else if (k === 'u') setShowUrl((v) => !v);
          else if (k === 'c' && s.result && !s.feedback) s.submitFeedback('agree');
          else if (k === 'w' && s.result && !s.feedback) s.submitFeedback('disagree');
        };
        const onPaste = (e) => {
          if (isTyping(e.target) || !e.clipboardData) return;
          const item = [...e.clipboardData.items].find((i) => i.type.startsWith('image/'));
          if (item) { e.preventDefault(); latest.current.runFiles([item.getAsFile()]); return; }
          const text = e.clipboardData.getData('text').trim();
          if (isUrl(text)) { e.preventDefault(); latest.current.runFromUrl(text); }
        };
        window.addEventListener('keydown', onKey);
        window.addEventListener('paste', onPaste);
        return () => { window.removeEventListener('keydown', onKey); window.removeEventListener('paste', onPaste); };
      }, []);

      /* Deep link from the extension: /?imageUrl=... */
      useEffect(() => {
        const url = new URLSearchParams(window.location.search).get('imageUrl');
        if (isUrl(url)) { setUrlInput(url); latest.current.runFromUrl(url); }
      }, []);

      /* Wake the server on page load. If /health is slow, it was asleep: show the curtain until it answers. */
      useEffect(() => {
        let done = false, retry = 0;
        const slow = setTimeout(() => { if (!done) setServer('cold'); }, COLD_AFTER_MS);
        const ping = async () => {
          try {
            const res = await fetch('/health', { cache: 'no-store' });
            if (!res.ok) throw new Error(`health ${res.status}`);
            if (done) return;
            done = true; clearTimeout(slow);
            setServer((s) => (s === 'cold' ? 'opening' : 'warm'));
          } catch {
            if (done) return;
            if (Date.now() - pageStart.current < 120000) retry = setTimeout(ping, 3000);
            else { done = true; clearTimeout(slow); setServer('warm'); }   // give up; requests will report their own errors
          }
        };
        ping();
        return () => { done = true; clearTimeout(slow); clearTimeout(retry); };
      }, []);
      useEffect(() => {                                       // let the curtain finish opening, then remove it
        if (server !== 'opening') return;
        const t = setTimeout(() => setServer('warm'), 1500);
        return () => clearTimeout(t);
      }, [server]);

      useEffect(() => {                                       // console easter egg, once
        console.log('%c\n  Sonnet XVIII (Adapted)\n\n  Shall I compare thee to a human hand?\n  Thou art more doubtful and more generate.\n  Rough algorithms do shake the darling buds of May,\n  And summer\'s lease hath all too short a render.\n\n  - AI or Not AI, v2.0.0\n',
          'font-style:italic;color:#a1a1aa;font-family:serif;font-size:13px;');
      }, []);
      useEffect(() => { document.body.classList.toggle('first-folio', folio); local.set('aon_folio', folio ? '1' : '0'); }, [folio]);
      useEffect(() => {
        document.title = result ? `${LABELS[result.prediction] || result.prediction} - AI or Not AI` : "AI or Not AI, That's the Question";
      }, [result]);
      useEffect(() => { if (error) scrollToTool('center'); }, [error]);
      useEffect(() => () => { if (preview) URL.revokeObjectURL(preview); }, [preview]);
      useEffect(() => () => { ctrl.current?.abort(); clearInterval(timer.current); }, []);

      return (
        <>
          <nav className="topbar">
            <button className="wordmark" onClick={home}>AI or Not AI</button>
            <div className="seg" role="group" aria-label="Analysis mode">
              <button className={`seg-btn ${mode === 'predict' ? 'on' : ''}`} aria-pressed={mode === 'predict'}
                title="Instant result, classification only (F)" onClick={() => chooseMode('predict')}>Fast</button>
              <button className={`seg-btn ${mode === 'explain' ? 'on' : ''}`} aria-pressed={mode === 'explain'}
                title="Wherein I'll catch the conscience of the machine (E)" onClick={() => chooseMode('explain')}><span className="hide-sm">The </span>Mousetrap</button>
            </div>
            <AccessMenu apiKey={apiKey} open={accessOpen} setOpen={setAccessOpen} onSave={saveKey} />
          </nav>

          {showSoliloquy && (
            <div className="soliloquy-overlay" role="dialog" aria-modal="true" aria-label="Soliloquy" onClick={() => setShowSoliloquy(false)}>
              <div className="soliloquy-content">
                <p>To be AI, or not to be AI, that is the question.</p>
                <p>Whether 'tis nobler in the machine to suffer</p>
                <p>The slings and arrows of outrageous training data,</p>
                <p>Or to take arms against a sea of pixels,</p>
                <p>And by opposing, generate them.</p>
                <div className="soliloquy-dismiss">[Press any key to return to thy inquiry]</div>
              </div>
            </div>
          )}

          <main className="main">
            {!result && !loading && (
              <section className={`playbill ${heroSeen ? 'compact' : ''}`}>
                <img src="/static/images.png" className="playbill-portrait" onClick={onPortrait}
                  alt="The Chandos Portrait. Authenticity: disputed."
                  title="The Chandos Portrait, c.1610. Attributed to John Taylor. Authenticity: disputed."
                  onError={(e) => { e.target.style.display = 'none'; }} />
                <div className="ornament" aria-hidden="true">❧  ❦  ❧</div>
                <h1 className="playbill-quote">"AI or Not AI, That's the Question."</h1>
                <div className="playbill-attribution">after Hamlet, Act III, Scene I</div>
                <p className="playbill-plain">Upload an image. The model says AI-made, human-made, or honestly not sure, and shows you where it looked.</p>
                <div className="ornament" style={{ fontSize: 11, letterSpacing: '.4em' }} aria-hidden="true">══════════════════</div>
                <div className="playbill-byline">A Philosophical Enquiry in Five Acts</div>
                <div className="playbill-edition">Presented at the Globe Theatre of the Web</div>
                <button className="scroll-cue" onClick={() => scrollToTool()}><span>Begin thy inquiry</span><span aria-hidden="true">↓</span></button>
              </section>
            )}

            {!result && !loading && (
              <div ref={toolRef}>
                <div className="act-label">ACT II · The Boards</div>
                <div className="stage-area">
                  <DropZone onFiles={runFiles} onUrl={runFromUrl} />
                  {error && (
                    <div className="err" role="alert">
                      <span><span style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic' }}>A tragedy of errors:</span> {error}</span>
                      <span className="err-actions">
                        {usingDemo && errCode === 429 && <button className="btn-retry" onClick={() => { setError(null); setAccessOpen(true); }}>Add your key</button>}
                        {!usingDemo && errCode === 401 && <button className="btn-retry" onClick={() => { saveKey(DEMO_KEY); setError(null); }}>Use demo access</button>}
                        <button className="btn-retry" onClick={() => setError(null)}>Dismiss</button>
                      </span>
                    </div>
                  )}
                  <div className="url-toggle">
                    {!showUrl ? (
                      <button onClick={() => setShowUrl(true)}>Or summon from URL</button>
                    ) : (
                      <div className="url-row">
                        <input type="url" placeholder="https://..." value={urlInput} autoFocus aria-label="Image URL"
                          onChange={(e) => setUrlInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && runFromUrl(urlInput)} />
                        <button className="btn-go" onClick={() => runFromUrl(urlInput)}>Analyze</button>
                        <button className="btn-go" aria-label="Close URL input" onClick={() => { setShowUrl(false); setUrlInput(''); }}>✕</button>
                      </div>
                    )}
                  </div>
                  <Samples onPick={runFromUrl} />
                  {(server === 'cold' || server === 'opening') && (
                    <Curtain since={pageStart.current} opening={server === 'opening'} live />
                  )}
                </div>
              </div>
            )}

            {loading && (
              <>
                <div className="act-label">ACT III · The Deliberation</div>
                <div className="loader-wrap" role="status" aria-live="polite">
                  {server === 'cold' || parseFloat(elapsed) >= WAKING_AFTER_S ? (
                    <div className="curtain-box"><Curtain since={runStart.current} /></div>
                  ) : (
                    <>
                      <span className="sr-only">{mode === 'explain' ? 'Analyzing the image and drawing the heatmap…' : 'Analyzing the image…'}</span>
                      <Scribe first={mode === 'explain' ? 'The plot thickens…' : 'Consulting the muse…'} />
                      <div className="elapsed" aria-hidden="true">{elapsed}s</div>
                    </>
                  )}
                </div>
              </>
            )}

            {result && !loading && (
              <>
                <div className="act-label">ACT IV · The Verdict</div>
                <Verdict result={result} mode={mode} preview={preview} round={round}
                  feedback={feedback} onFeedback={submitFeedback} onExeunt={reset} />
              </>
            )}

            <div className="act-label">ACT V · The Epilogue</div>
            <div className="fleuron" aria-hidden="true">❧  ❦  ❧</div>
            <ExtSection />
          </main>

          <div className="prompters-box">
            <div className="prompters-label">[Prompter]</div>
            <div className="kb"><kbd>E</kbd> The Mousetrap</div>
            <div className="kb"><kbd>F</kbd> Fast mode</div>
            <div className="kb"><kbd>U</kbd> Summon URL</div>
            <div className="kb"><kbd>R</kbd> Exeunt</div>
            <div className="kb"><kbd>Ctrl+V</kbd> Paste image</div>
            {result && !feedback && (<><div className="kb"><kbd>C</kbd> Correct</div><div className="kb"><kbd>W</kbd> Wrong</div></>)}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>

</html>
